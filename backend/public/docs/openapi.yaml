openapi: 3.0.3
info:
  title: CallMetrics API
  description: API REST multi-tenant para sistema de métricas de llamadas
  version: 1.0.0
  contact:
    name: sronaal

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo

security:
  - BearerAuth: []

paths:
  # ─── Auth ────────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Autentica un usuario y retorna tokens JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@callmetrics.com
              password: Secret123!
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Credenciales inválidas
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refrescar token
      description: Renueva el accessToken usando un refreshToken válido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIs...
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: Invalida el refresh token actual
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIs...
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Sesión cerrada correctamente
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario actual
      description: Retorna los datos del usuario autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/password:
    put:
      tags: [Auth]
      summary: Cambiar contraseña
      description: Cambia la contraseña del usuario autenticado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  minLength: 8
                newPassword:
                  type: string
                  minLength: 8
            example:
              currentPassword: Secret123!
              newPassword: NewSecret456!
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Contraseña actualizada correctamente
        '401':
          description: Contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/auth/primer-ingreso:
    put:
      tags: [Auth]
      summary: Primer ingreso
      description: Establece la contraseña inicial de un usuario recién creado
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, newPassword]
              properties:
                email:
                  type: string
                  format: email
                newPassword:
                  type: string
                  minLength: 8
            example:
              email: usuario@callmetrics.com
              newPassword: MiNuevaClave123!
      responses:
        '200':
          description: Contraseña establecida y sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Email no encontrado o usuario ya activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Tenants ─────────────────────────────────────────────────────────
  /api/tenants:
    get:
      tags: [Tenants]
      summary: Listar tenants
      description: Retorna tenants paginados (solo SUPER_ADMIN)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenants'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos (requiere SUPER_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Tenants]
      summary: Crear tenant
      description: Crea un nuevo tenant (solo SUPER_ADMIN)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
            example:
              nombre: Empresa XYZ
              nit: 900123456-7
              email: admin@empresaxyz.com
              telefono: 3001234567
              direccion: Calle 100 #15-20
              plan: enterprise
      responses:
        '201':
          description: Tenant creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/tenants/{id}:
    get:
      tags: [Tenants]
      summary: Obtener tenant por ID
      description: Retorna un tenant específico (solo SUPER_ADMIN)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tenant encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Tenants]
      summary: Actualizar tenant
      description: Actualiza los datos de un tenant (solo SUPER_ADMIN)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
            example:
              nombre: Empresa XYZ S.A.
              telefono: 3009876543
      responses:
        '200':
          description: Tenant actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/tenants/{id}/toggle:
    patch:
      tags: [Tenants]
      summary: Activar/desactivar tenant
      description: Alterna el estado activo/inactivo de un tenant (solo SUPER_ADMIN)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado del tenant actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Usuarios ────────────────────────────────────────────────────────
  /api/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: Retorna usuarios paginados del tenant actual
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Usuarios]
      summary: Crear usuario
      description: Crea un nuevo usuario en el tenant (requiere ADMIN_TENANT)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              nombre: Juan Pérez
              email: juan@callmetrics.com
              password: Clave123!
              rol: AGENTE
              extension: 101
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos (requiere ADMIN_TENANT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener usuario por ID
      description: Retorna un usuario específico
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Usuarios]
      summary: Actualizar usuario
      description: Actualiza los datos de un usuario (requiere ADMIN_TENANT)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              nombre: Juan Carlos Pérez
              rol: ADMIN_TENANT
              extension: 102
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/usuarios/{id}/toggle:
    patch:
      tags: [Usuarios]
      summary: Activar/desactivar usuario
      description: Alterna el estado activo/inactivo de un usuario (requiere ADMIN_TENANT)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado del usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Dashboard ───────────────────────────────────────────────────────
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Resumen del dashboard
      description: Retorna métricas aggregadas del dashboard (total llamadas, duración promedio, etc.)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas del dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
              example:
                totalLlamadas: 1248
                llamadasHoy: 87
                duracionPromedio: 245
                tasaRespuesta: 89.5
                llamadasPerdidas: 13
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT de autenticación

  schemas:
    # ─── Auth ──────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
        password:
          type: string
          minLength: 8
          description: Contraseña del usuario

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Token JWT de acceso
        refreshToken:
          type: string
          description: Token para renovar el accessToken
        user:
          $ref: '#/components/schemas/User'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Token de refresco válido

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    # ─── User ──────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          type: string
          enum: [SUPER_ADMIN, ADMIN_TENANT, AGENTE]
        extension:
          type: string
          nullable: true
        tenant_id:
          type: integer
          nullable: true
        activo:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        rol:
          type: string
          enum: [SUPER_ADMIN, ADMIN_TENANT, AGENTE]
        extension:
          type: string
          nullable: true
        tenant_id:
          type: integer
          nullable: true
          description: ID del tenant (solo SUPER_ADMIN puede asignar)

    UserUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        rol:
          type: string
          enum: [SUPER_ADMIN, ADMIN_TENANT, AGENTE]
        extension:
          type: string
          nullable: true

    # ─── Tenant ────────────────────────────────────────────────────
    Tenant:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        nit:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        plan:
          type: string
          enum: [basic, professional, enterprise]
          default: basic
        activo:
          type: boolean
        created_at:
          type: string
          format: date-time

    TenantCreate:
      type: object
      required: [nombre, nit, email]
      properties:
        nombre:
          type: string
          minLength: 2
        nit:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        plan:
          type: string
          enum: [basic, professional, enterprise]
          default: basic

    TenantUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
        nit:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        plan:
          type: string
          enum: [basic, professional, enterprise]

    # ─── Dashboard ─────────────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalLlamadas:
          type: integer
        llamadasHoy:
          type: integer
        duracionPromedio:
          type: number
          format: float
          description: Duración promedio en segundos
        tasaRespuesta:
          type: number
          format: float
          description: Porcentaje de respuesta
        llamadasPerdidas:
          type: integer

    # ─── Paginated ─────────────────────────────────────────────────
    PaginatedTenants:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        pages:
          type: integer

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        pages:
          type: integer

    # ─── Errors ────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error

    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Mapa de campo → lista de errores
